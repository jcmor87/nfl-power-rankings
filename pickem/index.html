<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Family Pick’em | Development preview</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-content">
      <a href="../">Power Rankings</a>
      <span class="preview">Development preview</span>
    </div>
  </header>
  <main class="shell">
    <h1>Family Pick’em</h1>
    <p class="intro">Try the picks board with fictional teams and matchups.</p>

    <section id="access" class="panel" aria-labelledby="access-title">
      <h2 id="access-title">Open the picks board</h2>
      <div class="access-actions">
        <button type="button" id="demo">Try sample picks</button>
      </div>
      <form id="sign-in" hidden>
        <h3>Sign in to the test project</h3>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
      </form>
      <p id="auth-status" role="status"></p>
    </section>

    <section id="board" hidden aria-labelledby="board-title">
      <div class="board-header">
        <div>
          <h2 id="board-title">Sample matchups</h2>
          <p id="progress">0 of 3 picks made</p>
        </div>
        <button type="button" id="exit" class="quiet">Exit preview</button>
      </div>
      <div id="games" class="games"></div>
      <p id="pick-status" role="status"></p>
    </section>
  </main>
</body>
</html>
